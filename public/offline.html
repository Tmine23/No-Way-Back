<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101422" />
    <title>Sin conexión · No Way Back</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101422; color: #f2f4f8; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 32px 24px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
      h1 { font-size: 44px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: -0.01em; }
      p { color: #a8bdce; font-size: 18px; line-height: 1.5; margin: 0; }
      button { align-self: flex-start; margin-top: 8px; min-height: 52px; padding: 0 24px; border: 0; border-radius: 8px; background: #9966cc; color: #fff; font-size: 17px; font-weight: 600; }
      img { width: 64px; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Cuando vuelva la señal, toca el botón para recargar.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
